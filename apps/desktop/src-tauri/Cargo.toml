[package]
name = "sayknowmind-desktop"
version = "0.1.5"
description = "SayknowMind Desktop App"
edition = "2021"

[features]
default = ["full"]
full = []   # Node.js sidecar + Next.js standalone 번들 (오프라인)
lite = []   # 원격 URL webview wrapper (경량)

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs-next = "2"
# Used by codex_status / ocp_status invoke commands to ping the local
# OCP proxy. Blocking client keeps the command handlers simple and
# avoids a tokio runtime hop for one short request.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
