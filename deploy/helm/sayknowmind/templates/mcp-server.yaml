{{- if .Values.mcpServer.enabled }}
{{- $component := "mcp-server" -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sayknowmind.svcHost" (dict "root" . "component" $component) }}
  labels: {{- include "sayknowmind.componentLabels" (merge (dict "component" $component) .) | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.mcpServer.port }}
      targetPort: 8082
      name: http
  selector: {{- include "sayknowmind.componentSelector" (dict "root" . "component" $component) | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sayknowmind.svcHost" (dict "root" . "component" $component) }}
  labels: {{- include "sayknowmind.componentLabels" (merge (dict "component" $component) .) | nindent 4 }}
spec:
  replicas: {{ .Values.mcpServer.replicas }}
  selector:
    matchLabels: {{- include "sayknowmind.componentSelector" (dict "root" . "component" $component) | nindent 6 }}
  template:
    metadata:
      labels: {{- include "sayknowmind.componentLabels" (merge (dict "component" $component) .) | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap-app.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "sayknowmind.serviceAccountName" . }}
      {{- include "sayknowmind.podDefaults" . | nindent 6 }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: mcp-server
          image: {{ include "sayknowmind.image" (dict "root" . "component" "mcp-server" "config" .Values.mcpServer) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: 8082
              name: http
          envFrom:
            - configMapRef:
                name: {{ include "sayknowmind.fullname" . }}-app
          env:
            - name: AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "sayknowmind.fullname" . }}-secrets
                  key: BETTER_AUTH_SECRET
            # Same shared key EdgeQuake enforces (empty => no-op while auth OFF).
            - name: EDGEQUAKE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "sayknowmind.fullname" . }}-secrets
                  key: EDGEQUAKE_API_KEY
          livenessProbe:
            httpGet: { path: /health, port: 8082 }
            initialDelaySeconds: 20
            periodSeconds: 30
          readinessProbe:
            httpGet: { path: /health, port: 8082 }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources: {{- toYaml .Values.mcpServer.resources | nindent 12 }}
          securityContext: {{- toYaml .Values.containerSecurityContext | nindent 12 }}
{{- end }}
