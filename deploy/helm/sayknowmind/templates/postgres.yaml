{{- if .Values.postgres.enabled }}
{{- $component := "postgres" -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sayknowmind.svcHost" (dict "root" . "component" $component) }}
  labels: {{- include "sayknowmind.componentLabels" (merge (dict "component" $component) .) | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None    # headless — required for StatefulSet stable DNS
  ports:
    - port: {{ .Values.postgres.port }}
      targetPort: 5432
      name: postgres
  selector: {{- include "sayknowmind.componentSelector" (dict "root" . "component" $component) | nindent 4 }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "sayknowmind.svcHost" (dict "root" . "component" $component) }}
  labels: {{- include "sayknowmind.componentLabels" (merge (dict "component" $component) .) | nindent 4 }}
spec:
  serviceName: {{ include "sayknowmind.svcHost" (dict "root" . "component" $component) }}
  replicas: 1
  selector:
    matchLabels: {{- include "sayknowmind.componentSelector" (dict "root" . "component" $component) | nindent 6 }}
  template:
    metadata:
      labels: {{- include "sayknowmind.componentLabels" (merge (dict "component" $component) .) | nindent 8 }}
    spec:
      serviceAccountName: {{ include "sayknowmind.serviceAccountName" . }}
      {{- include "sayknowmind.podDefaults" . | nindent 6 }}
      securityContext:
        # Postgres image runs as uid 999 — fsGroup ensures volume permissions
        fsGroup: 999
      containers:
        - name: postgres
          image: {{ include "sayknowmind.image" (dict "root" . "component" "postgres" "config" .Values.postgres) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.postgres.user | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "sayknowmind.fullname" . }}-secrets
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "{{ .Values.postgres.user }}"]
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "{{ .Values.postgres.user }}"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
          resources: {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: db-init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: db-init
          configMap:
            name: {{ include "sayknowmind.fullname" . }}-db-init
            defaultMode: 0755
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.postgres.storage.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgres.storage.size }}
{{- end }}
