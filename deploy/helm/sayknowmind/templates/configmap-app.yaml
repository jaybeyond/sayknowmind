apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sayknowmind.fullname" . }}-app
  labels: {{- include "sayknowmind.labels" . | nindent 4 }}
data:
  NODE_ENV: {{ .Values.app.nodeEnv | quote }}
  RUST_LOG: {{ .Values.app.rustLog | quote }}
  PRIVATE_MODE: {{ .Values.app.privateMode | quote }}

  # Public-facing URLs (used by web/auth/relay)
  BETTER_AUTH_URL: {{ include "sayknowmind.webPublicUrl" . | quote }}
  NEXT_PUBLIC_APP_URL: {{ include "sayknowmind.webPublicUrl" . | quote }}
  NEXT_PUBLIC_DEPLOY_MODE: {{ .Values.app.deployMode | quote }}
  TRUSTED_ORIGINS: {{ include "sayknowmind.trustedOrigins" . | quote }}
  REQUIRE_EMAIL_VERIFICATION: {{ .Values.app.requireEmailVerification | quote }}

  # Internal service URLs — DNS resolves these inside the cluster
  AI_SERVER_URL: {{ include "sayknowmind.svcUrl" (dict "root" . "component" "ai-server" "port" .Values.aiServer.port) | quote }}
  EDGEQUAKE_URL: {{ include "sayknowmind.svcUrl" (dict "root" . "component" "edgequake" "port" .Values.edgequake.port) | quote }}
  EDGEQUAKE_BASE_URL: {{ include "sayknowmind.svcUrl" (dict "root" . "component" "edgequake" "port" .Values.edgequake.port) | quote }}
  OCR_ENDPOINT: {{ include "sayknowmind.svcUrl" (dict "root" . "component" "ocr-server" "port" .Values.ocrServer.port) | quote }}
  SEARXNG_URL: {{ include "sayknowmind.svcUrl" (dict "root" . "component" "searxng" "port" .Values.searxng.port) | quote }}
  REDIS_URL: {{ printf "redis://%s:%v" (include "sayknowmind.svcHost" (dict "root" . "component" "redis")) .Values.redis.port | quote }}
  MCP_SERVER_URL: {{ include "sayknowmind.svcUrl" (dict "root" . "component" "mcp-server" "port" .Values.mcpServer.port) | quote }}
  RELAY_URL: {{ include "sayknowmind.relayPublicUrl" . | quote }}
  SAYKNOWMIND_URL: {{ include "sayknowmind.webPublicUrl" . | quote }}

  {{- if .Values.ollama.enabled }}
  OLLAMA_URL: {{ include "sayknowmind.svcUrl" (dict "root" . "component" "ollama" "port" .Values.ollama.port) | quote }}
  OLLAMA_HOST: {{ include "sayknowmind.svcUrl" (dict "root" . "component" "ollama" "port" .Values.ollama.port) | quote }}
  OLLAMA_AVAILABLE: "true"
  {{- end }}

  {{- if .Values.ipfs.enabled }}
  IPFS_KUBO_API: {{ include "sayknowmind.svcUrl" (dict "root" . "component" "ipfs" "port" .Values.ipfs.apiPort) | quote }}
  IPFS_GATEWAY: {{ printf "%s/ipfs" (include "sayknowmind.svcUrl" (dict "root" . "component" "ipfs" "port" .Values.ipfs.gatewayPort)) | quote }}
  {{- end }}

  # Postgres connection metadata (used by services that need a non-DSN view)
  POSTGRES_HOST: {{ include "sayknowmind.svcHost" (dict "root" . "component" "postgres") | quote }}
  POSTGRES_PORT: {{ .Values.postgres.port | quote }}
  POSTGRES_USER: {{ .Values.postgres.user | quote }}
  POSTGRES_DB: {{ .Values.postgres.database | quote }}

  # LLM / Embedding routing
  LLM_PROVIDER: {{ .Values.app.llm.provider | quote }}
  LLM_MODEL: {{ .Values.app.llm.model | quote }}
  EDGEQUAKE_DEFAULT_LLM_PROVIDER: {{ .Values.app.llm.provider | quote }}
  EDGEQUAKE_DEFAULT_LLM_MODEL: {{ .Values.app.llm.model | quote }}
  EMBEDDING_PROVIDER: {{ .Values.app.embedding.provider | quote }}
  EMBEDDING_MODEL: {{ .Values.app.embedding.model | quote }}
  EDGEQUAKE_DEFAULT_EMBEDDING_PROVIDER: {{ .Values.app.embedding.provider | quote }}
  EDGEQUAKE_DEFAULT_EMBEDDING_MODEL: {{ .Values.app.embedding.model | quote }}

  # Rate limiting
  RATE_LIMIT_TTL: {{ .Values.app.rateLimit.ttl | quote }}
  RATE_LIMIT_MAX: {{ .Values.app.rateLimit.max | quote }}
