apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sayknowmind.fullname" . }}-secrets
  labels: {{- include "sayknowmind.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ required "secrets.postgresPassword is required" .Values.secrets.postgresPassword | quote }}
  BETTER_AUTH_SECRET: {{ required "secrets.betterAuthSecret is required" .Values.secrets.betterAuthSecret | quote }}
  ENCRYPTION_KEY: {{ required "secrets.encryptionKey is required" .Values.secrets.encryptionKey | quote }}
  RELAY_SHARED_SECRET: {{ required "secrets.relaySharedSecret is required" .Values.secrets.relaySharedSecret | quote }}
  SEARXNG_SECRET_KEY: {{ required "secrets.searxngSecretKey is required" .Values.secrets.searxngSecretKey | quote }}
  AI_API_KEY: {{ .Values.secrets.aiApiKey | quote }}
  EDGEQUAKE_API_KEY: {{ .Values.secrets.edgequakeApiKey | quote }}
  OPENAI_API_KEY: {{ .Values.secrets.openaiApiKey | quote }}
  OPENROUTER_API_KEY: {{ .Values.secrets.openrouterApiKey | quote }}
  TELEGRAM_BOT_TOKEN: {{ .Values.secrets.telegramBotToken | quote }}
  TELEGRAM_WEBHOOK_SECRET: {{ .Values.secrets.telegramWebhookSecret | quote }}
