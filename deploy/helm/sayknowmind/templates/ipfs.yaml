{{- if .Values.ipfs.enabled }}
{{- $component := "ipfs" -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sayknowmind.svcHost" (dict "root" . "component" $component) }}
  labels: {{- include "sayknowmind.componentLabels" (merge (dict "component" $component) .) | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - port: {{ .Values.ipfs.apiPort }}
      targetPort: 5001
      name: api
    - port: {{ .Values.ipfs.gatewayPort }}
      targetPort: 8080
      name: gateway
  selector: {{- include "sayknowmind.componentSelector" (dict "root" . "component" $component) | nindent 4 }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "sayknowmind.svcHost" (dict "root" . "component" $component) }}
  labels: {{- include "sayknowmind.componentLabels" (merge (dict "component" $component) .) | nindent 4 }}
spec:
  serviceName: {{ include "sayknowmind.svcHost" (dict "root" . "component" $component) }}
  replicas: 1
  selector:
    matchLabels: {{- include "sayknowmind.componentSelector" (dict "root" . "component" $component) | nindent 6 }}
  template:
    metadata:
      labels: {{- include "sayknowmind.componentLabels" (merge (dict "component" $component) .) | nindent 8 }}
    spec:
      serviceAccountName: {{ include "sayknowmind.serviceAccountName" . }}
      {{- include "sayknowmind.podDefaults" . | nindent 6 }}
      containers:
        - name: ipfs
          image: {{ .Values.ipfs.image }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          env:
            - name: IPFS_PROFILE
              value: server
          ports:
            - containerPort: 5001
              name: api
            - containerPort: 8080
              name: gateway
            - containerPort: 4001
              name: swarm
          livenessProbe:
            tcpSocket: { port: 5001 }
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            tcpSocket: { port: 5001 }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources: {{- toYaml .Values.ipfs.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data/ipfs
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.ipfs.storage.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.ipfs.storage.size }}
{{- end }}
