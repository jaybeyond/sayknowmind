name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/sayknowmind

jobs:
  # ── Stage 1: Lint + Test + Build (Web) ─────────────────────
  lint-test-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sayknowmind_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: apps/web
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: apps/web
        run: pnpm lint

      - name: Test
        working-directory: apps/web
        env:
          DATABASE_URL: postgresql://postgres:testpass@localhost:5432/sayknowmind_test
        run: pnpm test

      - name: Build
        working-directory: apps/web
        run: pnpm build

  # ── Stage 1b: Build checks for other TypeScript packages ───
  build-ai-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install, build and test
        working-directory: apps/ai-server
        run: npm ci && npm run build && npm test

  build-mcp-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install, build and test
        working-directory: packages/mcp-server
        run: npm ci && npm run build && npm test

  build-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/dashboard/pnpm-lock.yaml
      - name: Install and build
        working-directory: apps/dashboard
        run: pnpm install --frozen-lockfile && pnpm build


  # ── Stage 1c: Relay-server typecheck ───────────────────────────
  typecheck-relay-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install and typecheck
        working-directory: packages/relay-server
        run: npm ci && npm run lint
        # relay-server has no test script; tsc --noEmit via `npm run lint`
        # is the only static gate available. Add tests when written.

  # ── Stage 1d: EdgeQuake Rust (fmt + clippy + unit tests) ───────
  test-edgequake-rust:
    runs-on: ubuntu-latest
    env:
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/edgequake/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('packages/edgequake/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: cargo fmt --check
        working-directory: packages/edgequake
        run: cargo fmt --all --check

      - name: cargo clippy -D warnings
        working-directory: packages/edgequake
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: cargo test (lib unit tests only)
        working-directory: packages/edgequake
        # --lib runs only the inline #[test] functions in src/; the e2e
        # integration tests under tests/ require a live Postgres with the
        # Apache AGE extension and external LLM credentials — excluded here.
        run: cargo test --lib --workspace --locked

  # ── Stage 2: Docker Build + Push ───────────────────────────
  docker-images:
    runs-on: ubuntu-latest
    needs: [lint-test-build, build-ai-server, build-mcp-server, build-dashboard]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: web
            context: ./apps/web
            dockerfile: ./apps/web/Dockerfile
            # Enterprise edition for the registry image; the Dockerfile default
            # is "local" (open/Railway), so it must be set saas explicitly here.
            buildArgs: NEXT_PUBLIC_AUTH_MODE=saas
          - name: web-local
            context: ./apps/web
            dockerfile: ./apps/web/Dockerfile
            # Open (local-auth) edition. NEXT_PUBLIC_AUTH_MODE is baked into the
            # client bundle at build time, so the local edition needs its own
            # image; the Helm chart selects it when app.authMode=local so the
            # client can't diverge from the runtime auth mode (CODE-REVIEW C11).
            buildArgs: NEXT_PUBLIC_AUTH_MODE=local
          - name: ai-server
            context: ./apps/ai-server
            dockerfile: ./apps/ai-server/Dockerfile
          - name: dashboard
            context: ./apps/dashboard
            dockerfile: ./apps/dashboard/Dockerfile
          - name: mcp-server
            context: ./packages/mcp-server
            dockerfile: ./packages/mcp-server/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.name }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: ${{ matrix.buildArgs }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Stage 3: DB Migration Check ────────────────────────────
  migration-check:
    runs-on: ubuntu-latest
    needs: lint-test-build
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sayknowmind_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Run init scripts
        env:
          PGPASSWORD: testpass
        run: |
          for f in db/init/*.sql; do
            echo "Running $f..."
            psql -h localhost -U postgres -d sayknowmind_test -f "$f" 2>&1 || true
          done

      - name: Run migrations
        env:
          PGPASSWORD: testpass
        run: |
          for f in db/migrations/*.sql; do
            echo "Running migration: $f"
            psql -h localhost -U postgres -d sayknowmind_test -f "$f"
          done
          echo "All migrations passed"
