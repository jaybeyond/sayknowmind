name: Deploy

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/sayknowmind

jobs:
  # ── Deploy to target environment ───────────────────────────
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'production' }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "tag=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.sha }}" >> $GITHUB_OUTPUT
          fi

      - name: Run DB migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          # Canonical, ordered, idempotent migration list — mirrors scripts/production-deploy.sh.
          # Failures propagate immediately (no || true except where explicitly noted).
          apply() {
            local f="$1"
            if [ ! -f "$f" ]; then echo "skip (missing): $f"; return 0; fi
            echo "==> $f"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"
          }

          apply db/init/10-integration-tokens.sql

          # 028 has a data-migration step from a legacy table that may not exist
          # on a fresh DB — the CREATE TABLE still runs, so || true is safe here.
          apply db/migrations/028_channel_links.sql || true
          apply db/migrations/029_add_bot_token_to_channel_links.sql
          apply db/migrations/030_add_lang_to_channel_links.sql

          # 031 GUARD: this migration contains DROP TABLE IF EXISTS — re-running it
          # wipes live chat data. Skip when the simple (id PK, user_id TEXT) schema
          # is already in place.
          CONV_SHAPE=$(psql "$DATABASE_URL" -tAc \
            "SELECT data_type FROM information_schema.columns
             WHERE table_name='conversations' AND column_name='user_id'" 2>/dev/null || true)
          if [ "$CONV_SHAPE" = "text" ]; then
            echo "skip (guard): 031_conversations_simple.sql — simple schema already applied"
          else
            apply db/migrations/031_conversations_simple.sql
          fi

          apply db/migrations/032_document_relations.sql
          apply db/migrations/033_categories_unique_index.sql
          apply db/migrations/034_notifications.sql
          apply db/migrations/035_admin_role.sql
          apply db/migrations/036_shared_content_share_token.sql
          apply db/migrations/037_channel_links_unique_channel_user.sql
          apply db/migrations/038_user_provider_configs.sql
          apply db/migrations/039_daily_usage_limits.sql
          # 040 only relevant for existing DBs with old rateLimit schema; best-effort.
          apply db/migrations/040_fix_ratelimit_for_better_auth_156.sql || true
          apply db/migrations/041_user_mcp_keys.sql
          apply db/migrations/042_tags_table.sql
          apply db/migrations/043_documents_web_compat.sql
          apply db/migrations/044_user_locale.sql
          apply db/migrations/045_fix_ocp_base_url.sql
          apply db/migrations/046_fix_provider_models.sql
          apply db/migrations/047_telegram_processed_updates.sql
          apply db/migrations/048_fix_codex_chatgpt_models.sql
          apply db/migrations/049_web_graph_schema_compat.sql
          apply db/migrations/050_telegram_per_bot_link_scope.sql
          apply db/migrations/051_mcp_audit_log.sql
          apply db/migrations/052_categories_unique_per_user_parent.sql
          apply db/migrations/053_add_organization_tables.sql
          apply db/migrations/054_add_organization_id_to_resources.sql
          apply db/migrations/055_team_visibility_defaults.sql
          apply db/migrations/056_add_resource_shares.sql
          apply db/migrations/057_backfill_orphan_organization_id.sql
          apply db/migrations/058_add_resource_team_shares.sql
          apply db/migrations/059_add_doc_collab.sql
          apply db/migrations/060_add_category_kind.sql
          apply db/migrations/061_add_document_versions.sql
          apply db/migrations/062_hash_mcp_api_keys.sql
          apply db/migrations/063_entities_per_org_unique.sql
          apply db/migrations/064_add_eq_document_id.sql
          apply db/migrations/065_privacy_default_and_share_cleanup.sql
          apply db/migrations/066_rls_org_backstop.sql
          apply db/migrations/067_add_tasks.sql
          apply db/migrations/068_work_items_due_datetime.sql
          apply db/migrations/069_work_items_start_date.sql

          # better-auth rateLimit (no migration file ships this)
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c '
            CREATE TABLE IF NOT EXISTS "rateLimit" (
              id text PRIMARY KEY, key text, count integer DEFAULT 0, "lastRequest" bigint
            );'

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /opt/sayknowmind
            export TAG=${{ steps.tag.outputs.tag }}
            export REGISTRY=${{ env.REGISTRY }}
            export IMAGE_PREFIX=${{ env.IMAGE_PREFIX }}
            # Sync the server checkout FIRST — compose services use build:
            # directives, so without this the deploy rebuilt whatever commit
            # happened to be on disk, not the one being deployed. --ff-only so
            # a hand-patched (diverged) server fails loudly instead of losing
            # its changes.
            git fetch origin
            git merge --ff-only origin/main
            # Use the repo's docker-compose.yml (all services: postgres, edgequake,
            # relay-server, web, etc.). Pull image: services first, then up with
            # --build so services using build: directives pick up the new commit.
            docker compose pull 2>/dev/null || true
            docker compose up -d --build --remove-orphans
            echo "Deployed $TAG ($(git rev-parse --short HEAD))"
